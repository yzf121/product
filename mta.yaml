_schema-version: 3.3.0
ID: abap-clean-core-ai-fiori-new
description: AI 助手平台 - 纯前端 UI5 + DashScope 版本
version: 1.4.3

modules:
  - name: comaiassistantaichatapp
    type: html5
    path: app/ai-chat-gui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: abap-clean-core-ai-fiori-new-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: abap-clean-core-ai-fiori-new-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comaiassistantaichatapp.zip
          name: comaiassistantaichatapp
          target-path: resources/

  - name: abap-clean-core-ai-fiori-new-destination-content
    type: com.sap.application.content
    requires:
      - name: abap-clean-core-ai-fiori-new-destination
        parameters:
          content-target: true
      - name: abap-clean-core-ai-fiori-new-html5-repo-host
        parameters:
          service-key:
            name: abap-clean-core-ai-fiori-new-html5-repo-host-key
      - name: abap-clean-core-ai-fiori-new-auth
        parameters:
          service-key:
            name: abap-clean-core-ai-fiori-new-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: abap-clean-core-ai-fiori-new-html5-repo-host
              ServiceInstanceName: abap-clean-core-ai-fiori-new-html5-repo-host
              ServiceKeyName: abap-clean-core-ai-fiori-new-html5-repo-host-key
              sap.cloud.service: abap-clean-core-ai-fiori-new
            - Name: abap-clean-core-ai-fiori-new-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: abap-clean-core-ai-fiori-new-auth
              ServiceKeyName: abap-clean-core-ai-fiori-new-auth-key
              sap.cloud.service: abap-clean-core-ai-fiori-new
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: abap-clean-core-ai-fiori-new-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: abap-clean-core-ai-fiori-new-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite

  - name: abap-clean-core-ai-fiori-new-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

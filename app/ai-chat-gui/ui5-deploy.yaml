# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.ai.assistant.aichatapp
type: application

resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
      # 排除该库，避免 specVersion 4.0+ 下 top-level-scope/eval 限制触发构建错误
      - /webapp/lib/highlight.min.js
      # 兜底：若构建输出按命名空间路径引用，也同步排除
      - /com/ai/assistant/aichatapp/lib/highlight.min.js

  # 从 Component-preload 中显式排除，避免 generateComponentPreload 报错
  componentPreload:
    excludes:
      - "com/ai/assistant/aichatapp/lib/highlight.min.js"
      # 兜底：无论路径如何变化，都排除该文件
      - "**/highlight.min.js"

  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: comaiassistantaichatapp
        relativePaths: true
        additionalFiles:
          - xs-app.json
